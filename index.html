<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<title>网站维护中</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
    background-color: #0d1117;
    background-image: radial-gradient(1200px 600px at 50% -15%, #17223b 0%, #0d1117 62%);
    background-repeat: no-repeat; background-attachment: fixed;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; text-align: center;
  }
  .card {
    width: min(520px, 100%);
    padding: clamp(28px, 7vw, 42px) clamp(20px, 6vw, 34px) clamp(24px, 6vw, 32px);
    border-radius: 20px; background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 18px 50px rgba(0,0,0,.38);
  }
  .title {
    font-size: clamp(18px, 4.6vw, 26px);
    font-weight: 700; line-height: 1.5; letter-spacing: .06em;
    word-break: break-word;
  }
  .countdown {
    margin: 22px 0 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    font-size: clamp(34px, 11vw, 56px); font-weight: 700;
    line-height: 1.15; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    background: linear-gradient(180deg, #ffffff 0%, #8bb4ff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .end-time {
    font-size: clamp(12px, 3.4vw, 14px); line-height: 1.8;
    color: #9fb0c6; word-break: break-word;
  }
  .end-time b { color: #cfe0ff; font-weight: 600; white-space: nowrap; }
  .progress-wrap {
    height: 10px; margin-top: 18px; border-radius: 999px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#3b82f6,#22d3ee);
    transition: width .8s linear;
  }
  .pct { margin-top: 10px; font-size: 13px; color: #67e8f9; font-weight: 600; }
  .tip { margin-top: 20px; font-size: 12px; line-height: 1.8; color: #6b7a90; }
  .loading-msg { margin-top: 20px; }
  .loading-msg .m1 {
    font-size: clamp(15px, 4.2vw, 18px); font-weight: 700;
    line-height: 1.8; color: #cfe0ff;
  }
  .loading-msg .m2 {
    margin-top: 10px; font-size: clamp(12px, 3.6vw, 14px);
    line-height: 1.9; color: #9fb0c6;
  }
  @media (max-width: 360px) { .card { padding: 24px 16px; border-radius: 16px; } }
</style>
</head>
<body>

<div class="card">
  <div class="title" id="title">正在进行维护</div>
  <div class="countdown" id="countdown">--:--:--</div>
  <div class="end-time" id="endTimeWrap">
    预计结束时间：<b id="endTime">--</b>（北京时间）
  </div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="bar"></div>
  </div>
  <div class="pct" id="pct">0.0%</div>
  <div class="tip" id="tip">维护结束后会显示提示，请耐心等待。</div>
  <div class="loading-msg" id="loadingMsg" hidden>
    <div class="m1">维护完毕，网页正在加载。</div>
    <div class="m2">这可能要三分钟的时间，或许您可以尝试刷新网页。</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ====== 下面三个变量由 main.go 自动替换，请勿手动改动 ====== */
  var END_TIME = 32503651140000;
  var START_TIME = 0;
  var REASON = "升级中… 到期时间：未定";
  /* =========================================================== */

  var titleEl      = document.getElementById("title");
  var cdEl         = document.getElementById("countdown");
  var endTimeEl    = document.getElementById("endTime");
  var endWrapEl    = document.getElementById("endTimeWrap");
  var progressWrap = document.getElementById("progressWrap");
  var barEl        = document.getElementById("bar");
  var pctEl        = document.getElementById("pct");
  var tipEl        = document.getElementById("tip");
  var loadingEl    = document.getElementById("loadingMsg");

  var pageLoadTime  = Date.now();
  var progressStart = (START_TIME > 0) ? START_TIME : pageLoadTime;
  var finished = false;
  var timer = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function formatBeijing(ms) {
    var d = new Date(ms + 8 * 60 * 60 * 1000);
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate())
         + " " + pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds());
  }

  function showFinished() {
    if (finished) return;
    finished = true;
    if (timer) { clearInterval(timer); timer = null; }
    cdEl.hidden = true;
    endWrapEl.hidden = true;
    progressWrap.hidden = true;
    pctEl.hidden = true;
    tipEl.hidden = true;
    loadingEl.hidden = false;
    document.title = "维护完毕";
  }

  function render() {
    var now = Date.now();
    var remain = END_TIME - now;
    if (remain <= 0) { showFinished(); return; }

    var totalSec = Math.floor(remain / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    cdEl.textContent = pad(h) + ":" + pad(m) + ":" + pad(s);

    var total = END_TIME - progressStart;
    var p = total > 0 ? (now - progressStart) / total : 1;
    if (p < 0) p = 0;
    if (p > 1) p = 1;
    barEl.style.width = (p * 100).toFixed(2) + "%";
    pctEl.textContent = (p * 100).toFixed(1) + "%";
  }

  /* 初始化 */
  titleEl.textContent = (REASON && REASON.trim()) ? REASON.trim() : "正在进行维护";
  endTimeEl.textContent = END_TIME > 0 ? formatBeijing(END_TIME) : "未配置";

  if (END_TIME <= 0) {
    cdEl.textContent = "--:--:--";
  } else if (END_TIME - Date.now() <= 0) {
    showFinished();
  } else {
    render();
    timer = setInterval(render, 250);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && !finished) render();
    });
  }
})();
</script>

</body>
</html>
